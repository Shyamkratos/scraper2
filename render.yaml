# Render Blueprint (optional). Or set Start Command in Dashboard.
services:
  - type: web
    name: cybersec-conferences
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scraper.py && gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
